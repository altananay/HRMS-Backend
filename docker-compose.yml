# Local development infrastructure for HRMS-Backend.
#
#   docker compose up -d                  # postgres + seq (the everyday dev loop)
#   docker compose --profile api up -d    # the above plus the API in a container
#
# The API is behind a profile deliberately: the normal loop is infra in Docker and
# `dotnet run` / `dotnet test` on the host, so you keep hot reload and the debugger.

name: hrms

services:
  postgres:
    image: postgres:17-alpine
    container_name: hrms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hrms
      POSTGRES_USER: hrms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hrms}
    ports:
      # Host 5433, not 5432: a natively-installed PostgreSQL service commonly already owns 5432 on
      # a developer machine, and binding over it silently connects the app to the wrong server —
      # which shows up as an authentication failure against a database you did not intend to use.
      - "5433:5432"
    volumes:
      - hrms-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms -d hrms"]
      interval: 5s
      timeout: 5s
      retries: 10

  seq:
    image: datalust/seq:latest
    container_name: hrms-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      # Required since Seq 2024.3: on first run the server refuses to start unless it is given an
      # admin password or told explicitly to run without authentication. Without one of the two it
      # crashes in its own bootstrapper and `restart: unless-stopped` hides that as a restart loop.
      # Open access is fine here and only here: this is a throwaway local log viewer. Do not copy
      # this into anything reachable from another machine — use SEQ_FIRSTRUN_ADMINPASSWORD there.
      # Note the value is "True", not "Y": ACCEPT_EULA is a flag Seq reads loosely, but the firstRun
      # overrides are typed and parsed with Convert.ChangeType, so "Y" throws a FormatException.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
    ports:
      - "5341:5341"   # ingestion
      - "8081:80"     # UI -> http://localhost:8081
    volumes:
      - hrms-seqdata:/data
    # Seq is optional for the app (an unset ServerUrl just skips the sink), so a broken Seq must not
    # be silently ignored the way it was before this healthcheck existed.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: Presentation/WebAPI/Dockerfile
    container_name: hrms-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=hrms;Username=hrms;Password=${POSTGRES_PASSWORD:-hrms}
      Serilog__Seq__ServerUrl: http://seq:5341
      # Left defaultable rather than `${VAR:?...}` because Compose interpolates every service,
      # including profiled ones, so a required-variable marker here would break a plain
      # `docker compose up`. The app validates these itself at startup (ValidateOnStart) and
      # refuses to boot with an empty signing key outside Development.
      TokenOptions__SecurityKey: ${TOKEN_SECURITY_KEY:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"

volumes:
  hrms-pgdata:
  hrms-seqdata:
